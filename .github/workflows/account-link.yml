name: Account link browser recovery
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  browser:
    name: Account link browser (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    # WebKit system dependencies can exceed ten minutes on a cold runner.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - run: pip install playwright==1.58.0
      - run: playwright install --with-deps ${{ matrix.engine }}
      - run: python tests/browser_account_link.py
        env:
          KAGNODE_BROWSER_ENGINE: ${{ matrix.engine }}
      - name: Local and KagNode sign-in journeys
        run: python tests/browser_provider.py
        env:
          KAGNODE_BROWSER_ENGINE: ${{ matrix.engine }}
