name: Account link browser recovery
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  browser:
    name: Account link browser (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: pip install playwright==1.58.0
      - run: playwright install --with-deps ${{ matrix.engine }}
      - run: python tests/browser_account_link.py
        env:
          KAGNODE_BROWSER_ENGINE: ${{ matrix.engine }}
