name: Signed release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Match immutable version
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - name: Validate release description
        run: |
          version=$(cat VERSION)
          notes=$(cat RELEASE_NOTES.md)
          test "$notes" = "Fixed for $version" || test "$notes" = "Added for $version"
      - name: Utilities and tests
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck libnss3-tools libreswan qrencode python3-venv wireguard-tools iptables iproute2
          python3 -m venv .venv
          python3 -c "import runpy; from pathlib import Path; Path('build').mkdir(exist_ok=True); Path('build/requirements.lock').write_text(runpy.run_path('src/vpn_dependencies.py')['REQUIREMENTS'])"
          .venv/bin/pip install --only-binary=:all: --require-hashes -r build/requirements.lock
          .venv/bin/pip install quickjs==1.19.4
          python3 build.py
          git diff --exit-code -- setup.sh update.sh assets/
          shellcheck -x setup.sh update.sh
          sudo .venv/bin/python -m unittest discover -s tests -v
          python3 tools/check_secrets.py
      - name: Build and sign
        env:
          SIGNING_KEY: ${{ secrets.VPN_RELEASE_KEY }}
        run: |
          umask 077
          python3 tools/qualify_release.py
          test -n "$SIGNING_KEY"
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$key"
          VPN_RELEASE_KEY="$key" python3 tools/package.py
          openssl pkeyutl -verify -pubin -inkey release-key.pem -rawin -in dist/manifest.json -sigfile dist/manifest.sig
      - name: Upload draft, verify downloads, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/*.deb dist/setup.sh dist/update.sh dist/SHA256SUMS dist/manifest.json dist/manifest.sig --draft --verify-tag --title "KagNode VPN ${GITHUB_REF_NAME#v}" --notes-file RELEASE_NOTES.md "${flags[@]}"
          gh release download "$GITHUB_REF_NAME" --dir downloaded
          python3 tools/verify_release.py downloaded "${GITHUB_REF_NAME#v}"
          gh release edit "$GITHUB_REF_NAME" --draft=false
