name: Repository and packages
on:
  push:
    branches: [main]
    tags: ['packages/v*', 'v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: python scripts/format_web.py --check
      - run: sudo apt-get update && sudo apt-get install -y rpm xz-utils
      - run: pip install -r requirements-format.txt
      - run: python scripts/format_source.py --check
      - run: python -m unittest discover -s tests -p test_repository_release.py -v
      - run: python -m unittest discover -s tests -p test_installer_protocol.py -v
      - run: python -m unittest discover -s tests -p test_account_sync.py -v
      - run: python scripts/repository_check.py
      - run: python scripts/release.py --output dist/packages
      - run: python scripts/verify_packages.py dist/packages
      - name: Debian and Rocky Linux 10 install / upgrade / removal
        run: python scripts/package_smoke.py dist/packages --engine docker
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: packaging-preview
          path: dist/packages/
  publish:
    if: startsWith(github.ref, 'refs/tags/packages/v') || startsWith(github.ref, 'refs/tags/v')
    needs: packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: packaging-preview
          path: packages
      - name: Publish checked release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, subprocess
          manifest=json.loads(pathlib.Path("packages/release-manifest.json").read_text())
          stable=manifest.get("channel")=="stable"
          tag=("v" if stable else "packages/v")+manifest["version"]
          assert os.environ["GITHUB_REF_NAME"]==tag
          notes=pathlib.Path("release-notes.md")
          notes.write_text("KagNode VPN "+manifest["product_version"]+"\n\n"+("Stable source and web-interface release." if stable else "Packaging preview.")+" Source/data packages install no services and do not qualify native networking, mail transport, images, hardware or media processors. Verify SHA256SUMS and release-manifest.json. See README and docs/VERIFICATION.md for tested scope.\n")
          args=["gh","release","create",tag,*[str(p) for p in sorted(pathlib.Path("packages").iterdir()) if p.is_file()],"--verify-tag","--title","KagNode VPN "+manifest["product_version"],"--notes-file",str(notes)]
          args += ["--latest=true"] if stable else ["--prerelease","--latest=false"]
          subprocess.run(args,check=True)
          PYTHON
