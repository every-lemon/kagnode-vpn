name: Repository and packaging previews
on:
  push:
    branches: [main]
    tags: ['packages/v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: python scripts/format_web.py --check
      - run: sudo apt-get update && sudo apt-get install -y rpm xz-utils
      - run: pip install -r requirements-format.txt
      - run: python scripts/format_source.py --check
      - run: python -m unittest discover -s tests -p test_repository_release.py -v
      - run: python -m unittest discover -s tests -p test_account_sync.py -v
      - run: python scripts/repository_check.py
      - run: python scripts/release.py --output dist/packages
      - run: python scripts/verify_packages.py dist/packages
      - name: Debian and Rocky Linux 10 install / upgrade / removal
        run: python scripts/package_smoke.py dist/packages --engine docker
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: packaging-preview
          path: dist/packages/
  publish:
    if: startsWith(github.ref, 'refs/tags/packages/v')
    needs: packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: packaging-preview
          path: packages
      - name: Publish immutable packaging prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(python3 -c 'import json;print(json.load(open("packages/release-manifest.json"))["version"])')
          test "$GITHUB_REF_NAME" = "packages/v$version"
          product_version=$(python3 -c 'import json;print(json.load(open("packages/release-manifest.json"))["product_version"])')
          packaging_revision=$(python3 -c 'import re,json;print(re.search(r"packaging\.(\d+)$",json.load(open("packages/release-manifest.json"))["version"])[1])')
          release_notes=$(mktemp)
          trap 'rm -f "$release_notes"' EXIT
          cat > "$release_notes" <<'RELEASE_NOTES'
          ## Status

          Packaging preview. Existing stable-release selections remain unchanged.

          ## Downloads

          Architecture-independent source archives/packages. Source payloads do not provision native services.

          Rocky Linux 10 package preview; no native service operation is claimed.

          Verify downloads with SHA256SUMS. release-manifest.json records the source commit, payload sizes and hashes.

          Native signed VPN updates retain their separate manifest/signature verification workflow.

          [Installation and requirements](https://github.com/every-lemon/kagnode-vpn#installation-and-downloads) · [Verification limits](https://github.com/every-lemon/kagnode-vpn/blob/main/docs/VERIFICATION.md)
          RELEASE_NOTES
          gh release create "$GITHUB_REF_NAME" packages/* --verify-tag --prerelease --latest=false --title "KagNode VPN $product_version · Packaging preview $packaging_revision" --notes-file "$release_notes"
