name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install test utilities
        run: sudo apt-get update && sudo apt-get install -y shellcheck libnss3-tools libreswan qrencode python3-venv wireguard-tools iptables iproute2
      - name: Python test environment
        run: |
          python3 -m venv .venv
          python3 -c "import runpy; from pathlib import Path; Path('build').mkdir(exist_ok=True); Path('build/requirements.lock').write_text(runpy.run_path('src/vpn_dependencies.py')['REQUIREMENTS'])"
          .venv/bin/pip install --only-binary=:all: --require-hashes -r build/requirements.lock
          .venv/bin/pip install quickjs==1.19.4
      - name: Rebuild and inspect
        run: |
          python3 build.py
          git diff --exit-code -- setup.sh update.sh assets/
          python3 -m compileall -q src
          bash -n setup.sh update.sh
          shellcheck -x setup.sh update.sh
          bash update.sh --verify
          python3 tools/check_secrets.py
      - name: Tests
        run: sudo .venv/bin/python -m unittest discover -s tests -v
      - name: Package inspection
        run: |
          python3 tools/package.py
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
          sha256sum dist/*.deb dist/setup.sh dist/update.sh
