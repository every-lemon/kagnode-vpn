<button type="button" data-core-login-provider disabled>
  Login with KagNode
</button>
<div data-core-login-status role="status"></div>
<form id="provider-mfa" hidden>
  <p>
    KagNode identity confirmed. Enter your local authenticator or recovery code.
  </p>
  <div class="kn-core-login-field">
    <label for="login-code">Authenticator or recovery code</label
    ><input
      id="login-code"
      name="code"
      autocomplete="one-time-code"
      required
      maxlength="128"
    />
  </div>
  <button type="submit" data-core-login-submit>Continue</button>
  <p id="provider-error" role="alert"></p>
  <a href="/manage">Use local sign-in</a>
</form>
